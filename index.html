<script>const K="go-roadmap-v1",KD="go-roadmap-days",KN="go-roadmap-notes",KP="go-roadmap-pace";
let S={};try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){S={}}
// миграция старого формата {ключ:1} -> {ключ:"done"}
for(const k in S){if(S[k]===1||S[k]===true)S[k]="done"}
let DY=[];try{DY=JSON.parse(localStorage.getItem(KD)||"[]")}catch(e){DY=[]}
let NT={};try{NT=JSON.parse(localStorage.getItem(KN)||"{}")}catch(e){NT={}}
let PW=parseInt(localStorage.getItem(KP)||"8",10);if(!(PW>0))PW=8;
let OPEN={};try{OPEN=JSON.parse(localStorage.getItem("go-roadmap-open")||"{}")}catch(e){OPEN={}}
const sv=()=>localStorage.setItem(K,JSON.stringify(S));
const svD=()=>localStorage.setItem(KD,JSON.stringify(DY));
const svN=()=>localStorage.setItem(KN,JSON.stringify(NT));
const svP=()=>localStorage.setItem(KP,String(PW));const svO=()=>localStorage.setItem("go-roadmap-open",JSON.stringify(OPEN));
const st=k=>(S[k]==="done"||S[k]==="learning"||S[k]==="todo")?S[k]:(S[k]?"done":"todo");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function markDay(){const t=today();if(!DY.includes(t)){DY.push(t);DY.sort();svD()}}

var qx=nx+Math.cos(sa)*95+(gh(nd.id+":"+k)-0.5)*56;
var qy=ny+Math.sin(sa)*80+(gh(nd.id+":"+k+"y")-0.5)*56;
GN.push({id:"Q"+si+"_"+ni+"_"+k,kind:"sub",label:sb.w,ref:nd,k:nd.id+":"+k,r:7.5,x:qx,y:qy,vx:0,vy:0,fx:null,fy:null,cx:nx,cy:ny,why:sb.y,task:sb.t,hh:sb.h,l:sb.l,hint:sb.hint,x2:sb.x,par:nd.m==="par"});
GE.push({a:"N"+nd.id,b:"Q"+si+"_"+ni+"_"+k,len:95,par:nd.m==="par",path:false,A:null,B:null})}}}
for(var j=0;j<GE.length;j++){var E=GE[j];E.A=gById(E.a);E.B=gById(E.b)}}
function gTick(){
var i,j,A,B,dx,dy,d,dd,F;
for(i=0;i<GN.length;i++){A=GN[i];
for(j=i+1;j<GN.length;j++){B=GN[j];
dx=B.x-A.x;dy=B.y-A.y;
d=Math.sqrt(dx*dx+dy*dy)||0.001;
dd=d<(A.r+B.r+22)?(A.r+B.r+22):d;
F=9000/(dd*dd);if(F>60)F=60;
dx/=d;dy/=d;
A.vx-=F*dx;A.vy-=F*dy;B.vx+=F*dx;B.vy+=F*dy}}
for(var e=0;e<GE.length;e++){var E=GE[e];A=E.A;B=E.B;if(!A||!B)continue;
dx=B.x-A.x;dy=B.y-A.y;d=Math.sqrt(dx*dx+dy*dy)||0.001;
F=(d-E.len)*0.02;
dx/=d;dy/=d;
A.vx+=F*dx;A.vy+=F*dy;B.vx-=F*dx;B.vy-=F*dy}
for(i=0;i<GN.length;i++){A=GN[i];
A.vx+=(A.cx-A.x)*0.004-A.x*0.0015;
A.vy+=(A.cy-A.y)*0.004-A.y*0.0015;
A.vx*=0.87;A.vy*=0.87;
if(A.fx!==null){A.x=A.fx;A.y=A.fy;A.vx=0;A.vy=0}
else{A.x+=A.vx;A.y+=A.vy}}}
function gCol(v){return v==="done"?"#3fb950":(v==="learning"?"#d29922":"#5b6572")}
function gDraw(){
var r=gCv.getBoundingClientRect(),dpr=1;
try{dpr=window.devicePixelRatio||1}catch(e){}
var W=r.width||800,H=r.height||480;
if(W<320)W=320;if(H<300)H=300;
var bw=Math.round(W*dpr),bh=Math.round(H*dpr);
if(gCv.width!==bw||gCv.height!==bh){gCv.width=bw;gCv.height=bh}
var g=gCtx,t=0;
try{t=performance.now()/1000}catch(e){}
g.save();g.setTransform(dpr,0,0,dpr,0,0);
g.fillStyle="#0a0e14";g.fillRect(0,0,W,H);
g.translate(W/2+GCam.x,H/2+GCam.y);g.scale(GCam.z,GCam.z);
var i,A,B,E,N,v;
for(i=0;i<GE.length;i++){E=GE[i];A=E.A;B=E.B;if(!A||!B)continue;
g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);
if(E.par){g.setLineDash([5,5]);g.strokeStyle="rgba(139,148,158,.4)";g.lineWidth=1}
else{g.setLineDash([]);g.strokeStyle=E.path?"rgba(47,129,247,.5)":"rgba(47,129,247,.75)";g.lineWidth=E.path?2.5:1.6}
g.stroke()}
g.setLineDash([]);g.textAlign="center";
for(i=0;i<GN.length;i++){N=GN[i];v=gNStat(N);
if(v==="learning"){var p=(Math.sin(t*3)+1)/2;
g.beginPath();g.arc(N.x,N.y,N.r+4+p*4,0,6.2832);
g.strokeStyle="rgba(210,153,34,"+(0.35+p*0.4).toFixed(3)+")";g.lineWidth=2+(1-p)*2;g.stroke()}
g.beginPath();g.arc(N.x,N.y,N.r,0,6.2832);
g.fillStyle=N===GSel?"#1c2942":(v==="done"?"rgba(63,185,80,.2)":(v==="learning"?"rgba(210,153,34,.22)":"#161d28"));
g.fill();g.lineWidth=N===GSel?3:2;g.strokeStyle=gCol(v);g.stroke();
g.fillStyle=v==="todo"?"#8b949e":"#e6edf3";
g.font=(N.kind==="stage"?"bold 13px":(N.kind==="node"?"12px":"10px"))+" system-ui,sans-serif";
if(N.kind!=="sub"||GCam.z>0.55)g.fillText(N.label,N.x,N.y+N.r+13)}
g.restore()}
function gLoop(){
if(!document.body.classList.contains("gmode")){GLoopOn=false;return}
GLoopOn=true;
if(GRun){gTick();gTick()}
gDraw();
try{requestAnimationFrame(gLoop)}catch(e){GLoopOn=false}}

function gPos(e){
var r=gCv.getBoundingClientRect(),W=r.width||800,H=r.height||480;
return {x:e.clientX,y:e.clientY,wx:(e.clientX-r.left-W/2-GCam.x)/GCam.z,wy:(e.clientY-r.top-H/2-GCam.y)/GCam.z}}
function gPick(px,py){
var r=gCv.getBoundingClientRect(),W=r.width||800,H=r.height||480;
var wx=(px-r.left-W/2-GCam.x)/GCam.z,wy=(py-r.top-H/2-GCam.y)/GCam.z;
var best=null,bd=1e9;
for(var i=GN.length-1;i>=0;i--){var N=GN[i],d=Math.sqrt((N.x-wx)*(N.x-wx)+(N.y-wy)*(N.y-wy))-(N.r+6);
if(d<bd){bd=d;best=N}}
return bd<=0?best:null}
function gSide(N){
var P=document.getElementById("gside");if(!P)return;
if(!N){P.classList.remove("on");P.innerHTML="";return}
var v=gNStat(N),h="";
h+="<h3>"+esc(N.label)+"</h3>"+'<div class="mut">';
if(N.kind==="stage")h+="Стадия · "+N.ref.n.length+" узла · статус: "+v;
else if(N.kind==="node")h+=(N.par?"Параллельный узел":"Узел по порядку")+" · "+N.ref.sub.length+" подтем · "+N.ref.h+" ч · статус: "+v;
else h+="Подтема · "+(N.hh||0)+" ч · статус: "+v;
h+="</div>";
if(N.why)h+='<div class="mut" style="margin-top:8px">Зачем: '+esc(N.why)+"</div>";
if(N.task)h+='<div style="margin-top:6px">'+esc(N.task)+"</div>";
if(N.docs)h+='<div class="mt">Docs: '+links(N.docs)+"</div>";
if(N.hint)h+='<div class="hn">'+esc(N.hint)+"</div>";
if(N.x2)h+='<div class="x2">Дополнительно: '+esc(N.x2)+"</div>";
if(N.mi)h+='<div class="mut">Milestone: '+esc(N.mi)+"</div>";
if(N.ds)h+='<div class="mut">'+esc(N.ds)+"</div>";
if(N.kind==="sub"){
h+='<div class="row" id="gstat"><button class="btn'+(v==="todo"?" on":"")+'" data-v="todo">todo</button><button class="btn'+(v==="learning"?" on":"")+'" data-v="learning">Сейчас изучаю</button><button class="btn'+(v==="done"?" on":"")+'" data-v="done">done</button></div>';
var nt="";try{nt=NT[N.k]||""}catch(e){}
h+='<textarea id="gnt" placeholder="Заметка…">'+esc(nt)+"</textarea>";
}else h+='<div class="mut" style="margin-top:8px">Статус считается по подтемам.</div>';
h+='<div class="row"><button class="btn" id="gclose">Закрыть</button></div>';
P.innerHTML=h;P.classList.add("on");
var c=document.getElementById("gclose");
if(c)c.onclick=function(){GSel=null;gSide(null);gDraw()};
if(N.kind!=="sub")return;
var bs=P.querySelectorAll("#gstat button"),i;
for(i=0;i<bs.length;i++)(function(b){b.onclick=function(){
var nv=b.getAttribute("data-v"),k=N.k;
if(nv==="todo"){try{delete S[k]}catch(e){}}else{S[k]=nv}
if(nv==="done")markDay();
sv();render();gUpdCur();gSide(N);gDraw()}})(bs[i]);
var ta=document.getElementById("gnt");
if(ta)ta.oninput=function(){try{if(ta.value)NT[N.k]=ta.value;else delete NT[N.k]}catch(e){}svN()}}
function gUpdCur(){
var f=false;
for(var i=0;i<GN.length;i++)if(gNStat(GN[i])==="learning"){f=true;break}
var b=document.getElementById("gcur");if(b)b.disabled=!f}
function gCur(){
var T=null,i;
for(i=0;i<GN.length;i++)if(GN[i].kind==="sub"&&gNStat(GN[i])==="learning"){T=GN[i];break}
if(!T)for(i=0;i<GN.length;i++)if(GN[i].kind!=="sub"&&gNStat(GN[i])==="learning"){T=GN[i];break}
if(!T)return;
var tx=-(T.x*1.1),ty=-(T.y*1.1),tz=1.1;
if(!GRun){GCam={x:tx,y:ty,z:tz};gDraw();return}
var t0=0;try{t0=performance.now()}catch(e){}
GAnim={sx:GCam.x,sy:GCam.y,sz:GCam.z,tx:tx,ty:ty,tz:tz,t0:t0};
try{requestAnimationFrame(gStep)}catch(e){GCam={x:tx,y:ty,z:tz};GAnim=null;gDraw()}}
function gStep(){
if(!GAnim)return;
var t=0;try{t=performance.now()}catch(e){}
var p=(t-GAnim.t0)/450;if(p>1)p=1;
var ez=1-Math.pow(1-p,3);
GCam.x=GAnim.sx+(GAnim.tx-GAnim.sx)*ez;
GCam.y=GAnim.sy+(GAnim.ty-GAnim.sy)*ez;
GCam.z=GAnim.sz+(GAnim.tz-GAnim.sz)*ez;
gDraw();
if(p<1&&document.body.classList.contains("gmode")){try{requestAnimationFrame(gStep)}catch(x){GAnim=null}}
else GAnim=null}
function gShow(on){
on=!!on;
document.body.classList.toggle("gmode",on);
var a=document.getElementById("vG"),b=document.getElementById("vL");
if(a)a.classList.toggle("on",on);
if(b)b.classList.toggle("on",!on);
try{localStorage.setItem("go-roadmap-view",on?"g":"l")}catch(e){}
if(!on)return;
try{
gBuild();gBind();
GCam={x:0,y:0,z:0.85};
gUpdCur();gDraw();
if(!GLoopOn){try{requestAnimationFrame(gLoop)}catch(x){}}
}catch(err){try{alert("Graph failed, staying in list: "+err)}catch(x){}gShow(false)}}

var GBound=false;
function gBind(){
if(GBound)return;GBound=true;
try{window.addEventListener("resize",function(){if(document.body.classList.contains("gmode"))gDraw()})}catch(e){}
gCv.addEventListener("pointerdown",function(e){
var p=gPos(e),N=gPick(p.x,p.y);
try{gCv.setPointerCapture(e.pointerId)}catch(x){}
if(N){GDrap={n:N,sx:e.clientX,sy:e.clientY,mov:false};N.fx=N.x;N.fy=N.y}
else GPan={x:e.clientX,y:e.clientY,cx:GCam.x,cy:GCam.y}});
gCv.addEventListener("pointermove",function(e){
if(GDrap){var p=gPos(e);
if(Math.abs(e.clientX-GDrap.sx)+Math.abs(e.clientY-GDrap.sy)>5)GDrap.mov=true;
GDrap.n.fx=p.wx;GDrap.n.fy=p.wy;gDraw();return}
if(GPan){GCam.x=GPan.cx+(e.clientX-GPan.x);GCam.y=GPan.cy+(e.clientY-GPan.y);gDraw();return}
var p2=gPos(e);GHov=gPick(p2.x,p2.y);
try{gCv.style.cursor=GHov?"pointer":"default"}catch(x){}});
gCv.addEventListener("pointerup",function(e){
if(GDrap){var Dp=GDrap;GDrap=null;Dp.n.fx=null;Dp.n.fy=null;
if(!Dp.mov){GSel=Dp.n;gSide(Dp.n)}
gDraw();return}
if(GPan){var moved=Math.abs(e.clientX-GPan.x)+Math.abs(e.clientY-GPan.y);GPan=null;
if(moved<4){GSel=null;gSide(null);gDraw()}}});
gCv.addEventListener("pointercancel",function(){if(GDrap){GDrap.n.fx=null;GDrap.n.fy=null;GDrap=null}GPan=null});
gCv.addEventListener("wheel",function(e){
if(e.preventDefault)e.preventDefault();
var r=gCv.getBoundingClientRect(),W=r.width||800,H=r.height||480;
var p=gPos(e),nz=GCam.z*(e.deltaY<0?1.12:0.89);
if(nz<0.25)nz=0.25;if(nz>3)nz=3;
GCam.x=(p.x-r.left-W/2)-p.wx*nz;
GCam.y=(p.y-r.top-H/2)-p.wy*nz;
GCam.z=nz;gDraw()},{passive:false});
function wire(id,fn){var el=document.getElementById(id);if(el)el.onclick=fn}
wire("gfit",function(){GCam={x:0,y:0,z:0.85};GAnim=null;gDraw()});
wire("gstop",function(){GRun=!GRun;
var b=document.getElementById("gstop");if(b)b.textContent=GRun?"⏸ Пауза":"▶ Пуск";
if(GRun&&!GLoopOn){try{requestAnimationFrame(gLoop)}catch(e){}}});
wire("gcur",gCur);
wire("vG",function(){gShow(true)});
wire("vL",function(){gShow(false)})}
gBind();
var gView=null;try{gView=localStorage.getItem("go-roadmap-view")}catch(e){}
gBuild();
if(gView==="g")gShow(true);
return "ok";
}catch(err){return "fail:"+(err&&err.message)} })();

</script></body></html>
